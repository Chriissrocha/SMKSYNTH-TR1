name: SMKLIVE - publish Stage Lab (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: smklive-stage-lab-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test installer guards
        run: node tests/smklive_web_install_test.mjs
      - name: Assemble static site (no historical firmware packages)
        run: |
          mkdir -p build/stage-lab-pages/{backup,install,docs}
          cp web/smklive-tester/index.html build/stage-lab-pages/index.html
          cp LICENSE CREDITS.md LICENSING.md build/stage-lab-pages/
          cp web/backup/* build/stage-lab-pages/backup/
          cp web/install/protocol.js build/stage-lab-pages/install/
          cp docs/INSTALLATION.md build/stage-lab-pages/docs/
          sed -i 's|href="../install/">Instalador SMKSYNTH|href="../">SMKLIVE Stage Lab|' build/stage-lab-pages/backup/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/stage-lab-pages
      - uses: actions/deploy-pages@v4
        id: deployment
