name: SMKLIVE - native tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: python3 -m pip install Pillow
      - name: Test SMKLIVE and legacy regression
        run: sh tests/run_smklive_tests.sh
      - name: Save actual LCD renders
        uses: actions/upload-artifact@v4
        with:
          name: SMKLIVE-LCD-render
          path: build/smklive/*.ppm
