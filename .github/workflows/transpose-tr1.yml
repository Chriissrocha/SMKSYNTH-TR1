name: Build SMKSYNTH TR1 (private candidate)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies and original toolchain
        run: |
          python3 -m pip install Pillow
          sh tools/get_toolchain.sh
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
      - name: Compile, verify and package all four TR1 firmwares
        run: python3 tools/build_transpose_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: SMKSYNTH-1.3.1-TR1-installer
          path: build/transpose-dist/
          if-no-files-found: error
